services:
  auditor-zero:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in your environment or .env}
      - JWT_EXPIRES_IN=8h
      # Keep this stable across restarts, or previously sealed ledgers won't verify.
      - LEDGER_SECRET=${LEDGER_SECRET:?set LEDGER_SECRET in your environment or .env}
      - DATABASE_PATH=/app/data/auditor-zero.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your environment or .env}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      # Enables the dev-only tamper endpoint for the live demo. Set to false for a real deployment.
      - ALLOW_TAMPER_DEMO=${ALLOW_TAMPER_DEMO:-true}
    volumes:
      - auditor-zero-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  auditor-zero-data:
