version: "3.9"
services:
  auditor-zero:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=8h
      - DATABASE_PATH=/app/data/auditor-zero.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    volumes:
      - auditor-zero-data:/app/data
    restart: unless-stopped

volumes:
  auditor-zero-data:
